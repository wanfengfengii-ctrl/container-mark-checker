services:
  api:
    build:
      context: ./backend
    image: container-gate-api:latest
    ports:
      # Host port is overridable via API_PORT.
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=2).status == 200 else 1)",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: container-gate-web:latest
    ports:
      # Host port is overridable via WEB_PORT.
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot acceptance service: exits 0 on success, non-zero on failure.
  # Opt-in via the "acceptance" profile so `docker compose up` only
  # starts web + api; run it explicitly with:
  #   docker compose run --rm --build verify
  verify:
    profiles: ["acceptance"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.verify
    image: container-gate-verify:latest
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      # Reach the services over the compose network, not via host ports.
      PLAYWRIGHT_BASE_URL: http://web
      PLAYWRIGHT_API_URL: http://api:8000
    volumes:
      - playwright-report:/app/playwright-report

volumes:
  playwright-report:
